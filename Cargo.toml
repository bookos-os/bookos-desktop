[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/smithay"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "LicenseRef-BookOS"
repository = "https://github.com/bookos/bookos-desktop"

[workspace.dependencies]
smithay = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# Smithay 0.7.0 con dos cambios. El primero es el commit ae6c51ba de upstream («xwm:
# Properly cleanup non-incremental outgoing transfers», +16/−5 en
# `src/xwayland/xwm/mod.rs`). Sin él, el gestor X11 guarda cada pegado ya
# terminado y, al siguiente, lo «cancela» con un SelectionNotify de fallo.
# VirtualBox pide siempre con `CurrentTime` y el mismo destino, así que toma
# ese fallo por la respuesta al pegado nuevo: el portapapeles del anfitrión
# llegaba a la máquina virtual una vez y luego `VERR_SHCLPB_NO_DATA` siempre.
#
# Y un segundo cambio que upstream no tiene: `X11Wm::new_selection` vacía la
# conexión. Sin eso, lo copiado en Wayland no se anunciaba a X11 hasta que
# otro suceso X11 cualquiera hacía escribir al gestor.
#
# Tercero, tampoco de upstream: `text_input_handle.rs` ya no descarta las
# peticiones de text-input-v3 cuando no hay ningún cliente input-method. El
# teclado en pantalla lo dibuja el propio compositor y necesita saber qué campo
# está activo y de qué tipo (`TextInputHandle::campo_activo`). Por lo mismo,
# `seat/keyboard.rs` y `text_input/mod.rs` mandan `enter`/`leave` de
# text-input aunque no haya IME.
# Lo que no es de upstream va marcado con «BookOS» dentro de la copia.
#
# Copia entera y no `git = …master`: del 0.7.0 al arreglo hay 101 commits que
# tocan DRM y render, y no ha salido versión nueva. Cuando salga la 0.8, se
# borran `vendor/smithay`, este bloque y el `exclude` de arriba.
[patch.crates-io]
smithay = { path = "vendor/smithay" }

# El perfil de release importa aquí: el compositor corre en el bucle de frames.
# fat LTO + 1 unidad de codegen dan menos saltos indirectos y binario más
# pequeño, que en un portátil se traduce en menos I-cache miss por frame.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"        # el shell in-process se recupera con catch_unwind
strip = "debuginfo"

# Las **dependencias** se optimizan también en depuración. Sin esto, un
# `cargo run` normal es inusable: medido en esta máquina, dibujar el dock pasa
# de 1 ms a 59 y el panel de 1 a 45, o sea unas 43 veces más lento, y mover el
# ratón por el dock daba 17 fotogramas por segundo. No es el código de aquí: casi
# todo ese tiempo se va dentro de `tiny-skia`, `resvg` y `cosmic-text`, que sin
# optimizar son otro programa.
#
# El código propio se queda **sin** optimizar, así que compilar sigue siendo
# rápido y las trazas y los pánicos siguen apuntando a la línea correcta. Solo
# se paga la primera compilación de las dependencias, que ya se hacía una vez.
[profile.dev.package."*"]
opt-level = 3
