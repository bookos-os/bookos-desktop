[package]
name = "bookos-comp"
description = "Compositor Wayland de BookOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Por defecto solo el backend anidado: se desarrolla dentro de la sesión Plasma
# actual sin salir a un TTY, y no necesita las cabeceras de DRM/libinput/libseat.
default = ["winit", "udev"]
winit = ["smithay/backend_winit"]
# El backend real sobre KMS. Requiere estas cabeceras, ya instaladas:
#   libinput-devel mesa-libgbm-devel libdrm-devel libseat-devel
#   libdisplay-info-devel
udev = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
]

[dependencies]
bookos-system = { path = "../bookos-system" }
smithay = { workspace = true, features = [
    "backend_egl",
    "renderer_gl",      # GLES2: un único contexto GPU en el proceso
    "wayland_frontend",
    "desktop",
    "use_system_lib",
    # XWayland. Habla X11 con x11rb, en Rust puro, así que no añade ninguna
    # cabecera de sistema a las que ya hacían falta. Va siempre activado y no
    # detrás de una característica: si el binario `Xwayland` no está instalado
    # se avisa y la sesión sigue sin él, que es el mismo resultado que apagarlo
    # en tiempo de compilación pero sin partir el código en dos.
    "xwayland",
] }
bookos-shell = { path = "../bookos-shell" }
# Los dos ya forman parte del árbol de Iced. Se declaran aquí porque el
# compositor necesita los píxeles del fondo, no un widget: `resvg` rasteriza
# SVG y `image` entrega los fotogramas WebP sin cargar la animación entera.
resvg = "0.49"
image = { version = "0.25", default-features = false, features = ["webp"] }
# Para dibujar el cursor del tema del sistema. Un compositor tiene que pintar
# el cursor él mismo; si no, el puntero funciona pero es invisible.
xcursor = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
# El servidor de notificaciones (`org.freedesktop.Notifications`), que es
# D-Bus y no hay forma de que no lo sea: es la única interfaz que las
# aplicaciones conocen para avisar de algo.
#
# Se usa la **API bloqueante** desde un hilo aparte, no la asíncrona: meter un
# ejecutor async en el proceso obligaría a casarlo con `calloop`, que es quien
# manda aquí, y el hilo con un canal hacia el bucle hace lo mismo sin que el
# bucle de frames se entere de que existe. Por eso tampoco se activa `tokio`.
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
# Solo para derivar los tipos que viajan por D-Bus en `pantallas.rs`. No es una
# dependencia nueva de verdad: `serde` y su `derive` ya entraban en el árbol con
# `zvariant`, que es quien serializa los mensajes del bus.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
libloading = "0.8"
# PipeWire, para el portal de compartir pantalla. No hay alternativa: es la
# única forma de entregar vídeo a un navegador, a OBS o a cualquier cosa que
# pase por `xdg-desktop-portal`.
#
# Añade dos cabeceras de sistema a las que ya hacían falta —`pipewire-devel`
# trae `libpipewire-0.3.pc` y `libspa-0.2.pc`— y `clang-devel` para el bindgen
# de `pipewire-sys`. No va detrás de una característica por lo mismo que
# `xwayland`: una sesión de escritorio sin compartir pantalla no es una sesión
# de escritorio, y el runtime de PipeWire ya está en cualquier instalación
# porque es quien lleva el audio.
#
# `v0_3_34` es el mínimo que hace falta: es donde aparecen `pw_stream_is_driving`
# y `pw_stream_trigger_process`, que son los que permiten que el reloj del
# stream sea el compositor y no PipeWire. Se pide la versión más baja que sirve
# y no la más alta para no exigir un PipeWire recién sacado.
pipewire = { version = "0.10", features = ["v0_3_34"] }
libspa = "0.10"

[dev-dependencies]
bookos-system = { path = "../bookos-system", features = ["test-fixtures"] }
